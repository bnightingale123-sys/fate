server {
    listen 80;
    server_name yourfate.xyz www.yourfate.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourfate.xyz www.yourfate.xyz;

    ssl_certificate /etc/letsencrypt/live/yourfate.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourfate.xyz/privkey.pem;

    location /mcp {
        proxy_pass http://127.0.0.1:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        return 200 "OK - MCP endpoint at /mcp\n";
        add_header Content-Type text/plain;
    }
}
